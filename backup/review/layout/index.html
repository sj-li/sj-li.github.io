<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>主页排版对照</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#f6f5f8;color:#34303b;font:14px/1.65 system-ui,sans-serif}main{max-width:1680px;margin:auto}h1{font-size:23px;font-weight:600;margin:0 0 5px}p{margin:0 0 18px;color:#706879}a{color:#714abb}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:20px}button{font:inherit;padding:8px 18px;border:1px solid #d6cce5;border-radius:5px;background:white;color:#714abb;cursor:pointer}button[aria-pressed=true]{background:#714abb;color:white;border-color:#714abb}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.panel{min-width:0}.panel h2{font-size:15px;font-weight:600;margin:0 0 9px}.panel a{display:block}.panel img{width:100%;display:block;border:1px solid #e4dfe9;box-shadow:0 3px 14px #30204009;border-radius:3px}footer{margin-top:25px;color:#706879;font-size:13px}.mobile img{max-width:390px;margin:auto}.mobile h2{text-align:center}@media(max-width:800px){body{padding:20px}header{display:block}.grid{grid-template-columns:1fr;gap:28px}.panel{max-width:600px;width:100%;margin:auto}.tabs{flex-wrap:wrap}}
</style><meta content="noindex, nofollow" name="robots"/></head><body><main><header><div><h1>主页排版对照</h1><p>同尺寸浏览器渲染。点击截图可查看原尺寸。</p></div><a href="../../../">打开优化后的主页 →</a></header><nav aria-label="截图视图" class="tabs"><button aria-pressed="true" data-view="desktop" type="button">桌面首屏</button><button aria-pressed="false" data-view="publications" type="button">论文栏目</button><button aria-pressed="false" data-view="mobile" type="button">手机首屏</button></nav><div class="grid"><section class="panel"><h2>参考 · Manling Li</h2><a data-stage="reference" href="reference-desktop.webp"><img alt="参考主页截图" src="reference-desktop.webp"/></a></section><section class="panel"><h2>优化前</h2><a data-stage="before" href="before-desktop.webp"><img alt="优化前主页截图" src="before-desktop.webp"/></a></section><section class="panel"><h2>优化后</h2><a data-stage="after" href="after-desktop.webp"><img alt="优化后主页截图" src="after-desktop.webp"/></a></section></div><footer>参考：<a href="https://limanling.github.io/">limanling.github.io</a> · 桌面视口 1440 × 1080，手机视口 390 × 844。<br/>补充截图：<a href="after-details.webp">荣誉、学术服务与项目</a> · <a href="after-mobile-publications.webp">手机论文栏目</a></footer></main><script>document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{const view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('.grid').classList.toggle('mobile',view==='mobile');document.querySelectorAll('[data-stage]').forEach(a=>{const src=`${a.dataset.stage}-${view}.webp`;a.href=src;a.querySelector('img').src=src})}));</script></body></html>
